<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GG</title>
    <link rel="stylesheet" href="/static/homepage.css" />
  </head>
  <body>
    <header>
      <h1><a href="localhost:8080/">Grit:Gossip</a></h1>
      <nav>
        <a href="/login" id="logIn">Log In</a>
        <a href="/signup" id="signUp">Sign Up</a>
      </nav>
    </header>

    <div class="post-list">
      <button class="button" onclick="openPopup()">Create New Post</button>

      {{range .Posts}}
      <div class="post">
        <h2>{{.Title}}</h2>
        <p>{{.Content}}</p>
        <p>Like: {{.LikeCount}} Number of Comments: {{.CommentCount}}</p>
        <p>Author: {{.UserName}} Created at: {{.CreatedAt}}</p>
        <p>Categories: {{.Categories}}</p>
      </div>

      {{end}}
    </div>

    <div class="popup-overlay" id="popupOverlay"></div>

    <div class="popup" id="popup">
      <h2>Create New Post</h2>
      <form>
        <label for="title">Title:</label><br />
        <input type="text" id="title" name="title" required /><br /><br />

        <label for="body">Body:</label><br />
        <textarea id="body" name="body" rows="4" required></textarea
        ><br /><br />

        <button type="submit" class="button">Post</button>
        <button type="button" class="button" onclick="closePopup()">
          Cancel
        </button>
      </form>
    </div>

    <script src="/static/script/homepage.js"></script>
  </body>
</html>
