<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Page</title>
    <link rel="stylesheet" href="/static/profile.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script src="/static/script/feedback.js" defer></script>
  </head>
  <body>
    {{template "header" .}}

    <div class="content">
      <div class="profile-header">
        <h2>Name: {{.Name}}</h2>
        <h2>Email: {{.Email}}</h2>
      </div>

      <div class="post-block">
        <h3>Your Posts:</h3>
        {{range .Posts}}
      
        <div class="posts">
        <h5>[{{.UserName}}] {{.CreatedAt}}</h5>
        <h3 class="post-title">
            <a href="/post?id={{.ID}}"> {{.Title}}</a>
        </h3>
        <pre class="post-body">{{.Content}}</pre>

        <div class="post-actions" data-id={{.ID}} data-state="{{.Rating}}">
          <button class="icon-button like-button" data-id={{.ID}} data-for="post">
            <i class="fas fa-thumbs-up"></i> <span>{{.LikeCount}}</span>
          </button>
          <button class="icon-button dislike-button" data-id={{.ID}} data-for="post">
            <i class="fas fa-thumbs-down"></i> <span>{{.DislikeCount}}</span>
          </button>
          <button class="icon-button">
            <i class="fas fa-comment"></i> <span>{{.CommentCount}}</span>
          </button>
          <p class="icon-button">
            <span>{{.CatNames}}</span>
          </p>
        </div>
      </div>
        {{end}}
      </div>
    </div>
  </body>
</html>
