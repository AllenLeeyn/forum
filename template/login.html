<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/login.css" />
    <title>Login</title>
  </head>
  <body>
    <div class="container">
      <!-- Left side with image background -->
      <div class="image-section">
        <div class="shape-1"></div>
        <div class="shape-2"></div>
        <div class="image-content">
          <h1>Welcome Back!</h1>
          <p>
            Log in to your account to continue your journey with us. We're
            excited to show you what's new!
          </p>
        </div>
      </div>

      <!-- Right side with login form -->
      <div class="form-section">
        <div class="form-container">
          <h2>Login</h2>
          <form action="/login" method="post" id="form">
            <div class="input-group">
              <input type="text" name="username" required />
              <label>Username</label>
            </div>
            <div class="input-group">
              <input type="password" name="password" required />
              <label>Password</label>
            </div>
            <div class="remember">
              <input type="checkbox" id="remember" />
              <label for="remember">Remember me</label>
            </div>
            <button type="submit">Login</button>
            <div class="signUp-link">
              <p>Don't have an account? <a href="/signup">Sign Up</a></p>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script>
      const usernameField = document.querySelector("input[name='username']");
      const passwordField = document.querySelector("input[name='password']");
      const form = document.getElementById("form");

      let errorElement = document.createElement("div");
      errorElement.setAttribute("id", "error");
      form.insertBefore(errorElement, form.firstChild);

      form.addEventListener("submit", (e) => {
        let messages = [];

        if (usernameField.value.trim() === "") {
          messages.push("Username is required.");
        } else if (usernameField.value.length > 25) {
          messages.push("Username must be less than 25 characters.");
        } else if (!/^[\u0000-\u007F]+$/.test(usernameField.value)) {
          messages.push("Username must not contain non-ASCII characters.");
        }

        if (passwordField.value.trim() === "") {
          messages.push("Password is required.");
        } else if (passwordField.value.length <= 6) {
          messages.push("Password must be longer than 6 characters.");
        } else if (passwordField.value.length >= 20) {
          messages.push("Password must be less than 20 characters.");
        } else if (passwordField.value.toLowerCase() === "password") {
          messages.push("Password cannot be 'password'.");
        }

        if (messages.length > 0) {
          e.preventDefault();
          errorElement.innerText = messages.join("\n");
        }
      });
    </script>
  </body>
</html>
