<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <title>grit:hub</title>
    <link rel="stylesheet" href="/static/toastMsg.css" />
    <link rel="stylesheet" type="text/css" href="/static/signup.css" />
    <script src="/static/script/signup.js" defer></script>
    <script src="/static/script/header.js" defer></script>
  </head>
  <body>
    <div class="container">
      <!-- Left side with image background -->
      <div class="image-section">
        <div class="shape-1"></div>
        <div class="shape-2"></div>
        <div class="image-content">
          <h1>Welcome to grit:hub!</h1>
          <p>Sign up to continue your journey today!!!</p>
          <br>
          <br>
          <a href="/" class="back-link">Back to the home</a>
        </div>
      </div>

      <!-- Right side with login form -->
      <div class="form-section">
        <div class="form-container">
          <h2>Sign Up</h2>
          <form action="/signup" method="post" id="form">
            <div class="input-group">
              <input type="text" name="username" required />
              <label>Username</label>
            </div>
            <div class="input-group input-email">
              <input type="email" name="email" required placeholder=" ">
              <label>Email</label>
            </div>
            <div class="input-group">
              <input type="password" name="password" required />
              <label>Password</label>
            </div>
            <div class="input-group">
              <input type="password" name="confirm-password" required />
              <label>Confirm Password</label>
            </div>
            <div class="terms-and-conditions">
              <label for="remember"
                >by signing up you agree to our
                <a href="/terms">terms.</a></label
              >
            </div>
            <button type="submit" id="submit">Sign Up</button>
            <div class="login-link">
              <p>Already have an account? <a href="/login">Log in</a></p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
