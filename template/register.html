<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/register.css"/>
    <link rel="stylesheet" href="/static/header.css"/>
    <title>Register</title>
  </head> 

{{template "header"}}
  <body>
    <div class="all-wrap">
      <form action="/register" method="post" id="form">
        <h2>Sign up</h2>
        <div class="all-input">
          <label for="name">Username</label>
          <input
            type="text"
            name="name"
            id="name"
            placeholder="name"
            required
          />
        </div>


        <div class="all-input">
          <label for="name">Email Address</label>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="email"
            required
          />
        </div>


        <div class="all-input">
          <label for="password">Create password</label>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="password"
            required
          />
        </div>


        <div class="all-input">
          <label for="password">Confirm password</label>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="password"
            required
          />
        </div>


          <button id="submit" type="submit">Sign up</button>
          <p class="register">
            Already have an account?
            <a href="/login"
              >Login</a
            >
          </p>
        </div>
      </form>
    </div>
  </body>
  <script src="/script/login-reg.js"></script>
</html>
