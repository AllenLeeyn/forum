<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forum Topics</title>
    <link rel="stylesheet" href="/static/home.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script src="/static/script/feedback.js" defer></script>
    <script src="/static/script/post.js" defer></script>
  </head>
  <body>
    {{template "header" .}}

    <div class="content">
      <div class="post-block">
      <h5>[{{.Post.UserName}}] {{.Post.CreatedAt}}</h5>
      <h3 class="post-title">
        {{.Post.Title}}
      </h3>
      <pre class="post-body">{{.Post.Content}}</pre>

      <div class="post-actions" data-id={{.Post.ID}} data-state="{{.Post.Rating}}" data-for="post">
        <button class="icon-button like-button" data-id={{.Post.ID}} data-for="post">
          <i class="fas fa-thumbs-up"></i> <span>{{.Post.LikeCount}}</span>
        </button>
        <button class="icon-button dislike-button" data-id={{.Post.ID}} data-for="post">
          <i class="fas fa-thumbs-down"></i> <span>{{.Post.DislikeCount}}</span>
        </button>
        <button class="icon-button">
          <i class="fas fa-comment"></i> <span>{{.Post.CommentCount}}</span>
        </button>
        <p class="icon-button">
          <span>{{.Post.CatNames}}</span>
        </p>
      </div>

      </div>
      <div id="comment-form">
        <textarea id="comment-input" placeholder="Write your comment here..." rows="3"></textarea>
        <button id="submit-comment">Post Comment</button>
      </div>

      {{range .Comments}}
      <div class="post-block">
        <h5>[{{.UserName}}] {{.CreatedAt}}</h5>
        <pre class="post-body">{{.Content}}</pre>
        <div class="post-actions" data-id={{.ID}} data-state="{{.Rating}}" data-for="comment">
          <button class="icon-button like-button" data-id={{.ID}} data-for="comment">
            <i class="fas fa-thumbs-up"></i> <span>{{.LikeCount}}</span>
          </button>
          <button class="icon-button dislike-button" data-id={{.ID}} data-for="comment">
            <i class="fas fa-thumbs-down"></i> <span>{{.DislikeCount}}</span>
          </button>
          </p>
        </div>
      </div>
      {{end}}
      </div>
    </div>
  </body>

  <script>
  </script>
</html>
