<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/static/images/favicon.ico" type="image/x-icon">
    <title>grit:hub</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="/static/toastMsg.css" />
    <link rel="stylesheet" href="/static/header.css" />
    <link rel="stylesheet" href="/static/viewPost.css" />
    <link rel="stylesheet" href="/static/postCard.css" />
    <script src="/static/script/toastMsg.js" defer></script>
    <script src="/static/script/header.js" defer></script>
    <script src="/static/script/feedback.js" defer></script>
    <script src="/static/script/submitComment.js" defer></script>
  </head>

  <body>
    {{template "header" .}}

    <div class="content">
      {{template "post-card" .Post}}

      <div id="comment-form">
        <textarea id="comment-input" placeholder="Write your comment here..." rows="3"></textarea>
        <button id="submit-comment">Post Comment</button>
      </div>

      {{range .Comments}}
      <div class="post-card">
        <div class="post-header">
          <div class="post-avatar">
            <i class="fas fa-user"></i>
          </div>
          <div class="post-meta">
            <a href="/profile?id={{.UserID}}" class="post-author">{{.UserName}}</a>
            <div class="post-time">{{.TimeAgo}}</div>
          </div>
        </div>
        <div class="post-content">
          <pre>{{.Content}}</pre>
        </div>
        <div class="post-actions" data-id={{.ID}} data-state="{{.Rating}}" data-for="comment">
          <button class="icon-button like-button" data-id={{.ID}} data-for="comment">
            <i class="fas fa-thumbs-up"></i> <span>{{.LikeCount}}</span>
          </button>
          <button class="icon-button dislike-button" data-id={{.ID}} data-for="comment">
            <i class="fas fa-thumbs-down"></i> <span>{{.DislikeCount}}</span>
          </button>
        </div>
      </div>
      {{end}}

      {{template "newPostModal" .}}
  </body>
</html>
